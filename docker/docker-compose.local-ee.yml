name: lightdash-local-ee
services:
    db:
        image: pgvector/pgvector:pg17
        environment:
            POSTGRES_PASSWORD: local-test-password
            POSTGRES_DB: lightdash
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U postgres -d lightdash']
            interval: 3s
            timeout: 3s
            retries: 30
    minio:
        image: minio/minio:latest
        command: server /data --console-address :9001
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        ports:
            - '127.0.0.1:19000:9000'
        volumes:
            - objects:/data
    app:
        image: lightdash-local-ee:test
        build:
            context: ..
            dockerfile: docker/Dockerfile.local-ee
        depends_on:
            db:
                condition: service_healthy
            minio:
                condition: service_started
        ports:
            - '127.0.0.1:18080:18080'
        environment:
            NODE_ENV: production
            LIGHTDASH_MODE: development
            PGHOST: db
            PGPORT: '5432'
            PGUSER: postgres
            PGPASSWORD: local-test-password
            PGDATABASE: lightdash
            LIGHTDASH_SECRET: local-ee-test-secret-not-for-production
            LIGHTDASH_LICENSE_KEY: ''
            LIGHTDASH_LICENSE_CERTIFICATE: ''
            SITE_URL: http://localhost:18080
            PORT: '18080'
            SECURE_COOKIES: 'false'
            S3_ENDPOINT: http://minio:9000
            S3_PUBLIC_ENDPOINT: http://localhost:19000
            S3_REGION: us-east-1
            S3_BUCKET: default
            S3_ACCESS_KEY: minioadmin
            S3_SECRET_KEY: minioadmin
            S3_FORCE_PATH_STYLE: 'true'
            DBT_DEMO_DIR: /usr/app/examples/full-jaffle-shop-demo
            SCHEDULER_ENABLED: 'true'
            MCP_ENABLED: 'true'
            EMBEDDING_ENABLED: 'true'
            ALLOW_MULTIPLE_ORGS: 'true'
            GROUPS_ENABLED: 'true'
            SERVICE_ACCOUNT_ENABLED: 'true'
            HEADWAY_ENABLED: 'false'
            LIGHTDASH_INSTALL_TYPE: docker_image
        extra_hosts:
            - 'api.keygen.sh:127.0.0.1'
            - 'roadmap.lightdash.com:127.0.0.1'
volumes:
    postgres:
    objects:
