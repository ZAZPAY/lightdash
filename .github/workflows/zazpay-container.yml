name: Zazpay container

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zazpay-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    if: github.repository == 'ZAZPAY/lightdash'
    runs-on: ${{ vars.LIGHTDASH_BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      IMAGE: us-central1-docker.pkg.dev/p-bnpl/lightdash/lightdash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build AMD64 image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: docker/Dockerfile.zazpay
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/ZAZPAY/lightdash
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=zazpay-amd64
          cache-to: type=gha,scope=zazpay-amd64,mode=max
      - name: Check runtime user and enterprise configuration
        env:
          TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test "$(docker run --rm --entrypoint id "$IMAGE:$TAG" -u)" = "10001"
          docker run --rm --user 0 -e NODE_ENV=test \
            --entrypoint pnpm "$IMAGE:$TAG" \
            -F backend test src/config/parseConfig.test.ts \
            src/ee/clients/License/LicenseClient.test.ts
      - name: Authenticate publisher
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CONTAINER_PUBLISHER }}
          token_format: access_token
          create_credentials_file: false
      - name: Push immutable release
        id: push
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf '%s' "$ACCESS_TOKEN" | docker login \
            -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev
          docker push "$IMAGE:$TAG"
          DIGEST_REF="$(docker image inspect "$IMAGE:$TAG" --format '{{index .RepoDigests 0}}')"
          echo "image=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          {
            echo "### Published Lightdash image"
            echo
            echo "\`$DIGEST_REF\`"
            echo
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            echo "The deploy job bumps it in ZAZPAY/k8-manifests; Argo CD rolls lightdash-dev."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry login
        if: always() && github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        run: docker logout us-central1-docker.pkg.dev

  # Argo CD syncs k8-manifests main, so the digest bump is the deploy. Retries: other services push there too.
  deploy:
    needs: container
    if: needs.container.outputs.image != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OVERLAY: services/lightdash/overlays/development
      IMAGE: ${{ needs.container.outputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ZAZPAY/k8-manifests
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
      # sed, not kustomize edit: that rewrites the overlay and strips its comments.
      - name: Bump the development overlay and push to main
        run: |
          set -euo pipefail
          f="$OVERLAY/kustomization.yaml"
          grep -q '^  digest: sha256:' "$f"
          sed -i "s|^  digest: sha256:.*|  digest: ${IMAGE#*@}|" "$f"
          if git diff --quiet; then echo 'no manifest change'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(lightdash): bump dev image to ${GITHUB_SHA::8}"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected (attempt $attempt/3), rebasing"
            git pull --rebase origin main
          done
          exit 1
